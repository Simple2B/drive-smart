services:
  app:
    image: simple2b/drive-smart
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.drivesmartuae.rule=Host(`drivesmartuae.com`) || Host(`www.drivesmartuae.com`)"
      - "traefik.http.routers.drivesmartuae.tls=true"
      - "traefik.http.routers.drivesmartuae.tls.certresolver=myresolver"
